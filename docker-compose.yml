services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qhar-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - cafe_db_data:/app/server/data
    networks:
      - app-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qhar-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - app-net

volumes:
  cafe_db_data:

networks:
  app-net:
    driver: bridge